# App Store metadata — ja (release-01 R2).
name: "Shinsoku"
subtitle: "話すだけで文字入力、AI音声キーボード"
promotional_text: |
  どのAppでも、速く正確に音声で入力。自分のSonioxまたはBailianのAPIキーを使い、使った分だけサービスに直接支払います。Proは買い切りで、サブスクリプションはありません。
keywords: "音声入力,文字起こし,ディクテーション,音声認識,議事録,メモ,翻訳,口述"
description: |
  話すだけで、Shinsokuがあなたの声を整ったテキストにして、いま入力しているAppにそのまま届けます。

  話している間に文字がリアルタイムで表示されます。話し終えるとAIの後処理が言いよどみや句読点を整え、Shinsokuキーボードがカーソルの位置に挿入します。

  自分のAPIキーで使う。サブスクリプションなし
  Shinsokuを使うには、音声認識サービスのAPIキーが必要です（SonioxまたはBailian／Alibaba Cloud Model Studio）。AIの後処理と翻訳には、BailianまたはOpenAI互換のサービスを使います。料金は使った分だけサービスに直接支払います。Shinsokuのアカウントもサブスクリプションもありません。

  無料で使える機能
  • 話しながら文字が表示され、話し終えたらその場で編集
  • すべてのAppで使えるキーボード：「録音」をタップして話し、テキストを挿入
  • 内蔵プロファイルでAIの後処理：音声入力、チャット、確認、英語への翻訳
  • Appでもキーボードからでもプロファイルを切り替え
  • 下書き：録音はすべて残り、あとから編集やコピーが可能
  • iPhone Duoに対応：開くと片側に録音、もう片側に下書きや設定

  SHINSOKU PRO（買い切り）
  • カスタムプロファイル：自分のプロンプトを書き、どのプロファイルも編集
  • Appごとに自動切り替え：検索、Webアドレス、メール、メッセージの入力欄ルールと、ショートカットのアクション
  • デスクトップ：iPhoneを、MacやPCで動くShinsokuのワイヤレスマイクとして使用
  ファミリー共有に対応しています。

  プライバシーを大切に
  • アカウント不要。広告も分析ツールもありません
  • 音声とテキストは、あなたのキーでiPhoneから選んだサービスへ直接送られます
  • APIキーはデバイスのiOSキーチェーンにだけ保存されます
  • キーボードはネットワークに何も送信しません。フルアクセスは、Shinsokuで話したテキストを受け取るためだけに使います

  はじめかた
  1. SonioxまたはBailianでAPIキーを作成し、Shinsokuの設定に追加します。
  2. キーボードを追加：設定 › 一般 › キーボード › キーボード › 新しいキーボードを追加 › Shinsoku。続けて「フルアクセスを許可」をオンにします。
  3. 「録音」をタップして話しはじめます。

  認識できる言語はサービスによって異なります。Sonioxは日本語、英語、中国語、韓国語、ドイツ語、フランス語、スペイン語、ポルトガル語、イタリア語など数十の言語に対応しています。
whats_new: |
  ShinsokuのiPhone版、最初のリリースです。
