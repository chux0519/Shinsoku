# App Store metadata — ko (release-01 R2).
name: "Shinsoku"
subtitle: "말하면 바로 글이 되는 AI 음성 키보드"
promotional_text: |
  어떤 앱에서든 빠르고 정확하게 음성으로 입력하세요. 내 Soniox 또는 Bailian API 키로 쓴 만큼만 서비스에 직접 내고, Pro는 한 번만 구입하면 돼요. 구독은 없어요.
keywords: "음성입력,받아쓰기,음성인식,텍스트변환,녹음,메모,번역,타이핑,딕테이션"
description: |
  말하기만 하면 Shinsoku가 목소리를 깔끔한 텍스트로 바꿔, 지금 입력 중인 앱에 바로 넣어 줘요.

  말하는 동안 글자가 실시간으로 나타나요. 말을 마치면 AI 후처리가 군더더기 말과 문장 부호를 다듬고, Shinsoku 키보드가 커서 위치에 결과를 삽입해요.

  내 API 키로 사용, 구독 없음
  Shinsoku를 쓰려면 음성 인식 서비스의 API 키가 필요해요: Soniox 또는 Bailian(Alibaba Cloud Model Studio). AI 후처리와 번역에는 Bailian이나 OpenAI 호환 서비스를 사용해요. 요금은 쓴 만큼 서비스에 직접 내요. Shinsoku 계정도, 구독도 없어요.

  무료 기능
  • 말하는 동안 텍스트가 나타나고, 끝나면 그 자리에서 편집
  • 모든 앱에서 쓰는 키보드: 녹음을 탭하고 말한 뒤 텍스트 삽입
  • 기본 프로필로 AI 후처리: 받아쓰기, 채팅, 검토, 영어로 번역
  • 앱이나 키보드에서 바로 프로필 전환
  • 초안: 모든 녹음이 남아 있어 언제든 편집하거나 복사
  • iPhone Duo 지원: 펼치면 한쪽은 녹음, 다른 쪽은 초안이나 설정

  SHINSOKU PRO: 한 번 구입
  • 사용자 프로필: 나만의 프롬프트를 쓰고 모든 프로필 편집
  • 앱별 자동 전환: 검색, 웹 주소, 이메일, 메시지 입력란 규칙과 단축어 동작
  • 데스크톱: iPhone을 Mac이나 PC의 Shinsoku용 무선 마이크로 사용
  가족 공유가 포함돼요.

  개인정보 보호 중심
  • 계정, 광고, 분석 도구 없음
  • 오디오와 텍스트는 내 키로 iPhone에서 선택한 서비스로 바로 전송
  • API 키는 기기의 iOS 키체인에만 저장
  • 키보드는 네트워크로 아무것도 보내지 않아요. 전체 접근은 Shinsoku에서 말한 텍스트를 가져오는 데만 쓰여요

  시작하기
  1. Soniox 또는 Bailian에서 API 키를 만들고 Shinsoku 설정에 추가하세요.
  2. 키보드 추가: 설정 › 일반 › 키보드 › 키보드 › 새로운 키보드 추가 › Shinsoku, 그다음 전체 접근 허용을 켜세요.
  3. 녹음을 탭하고 말하세요.

  인식할 수 있는 언어는 서비스에 따라 달라요. Soniox는 한국어, 영어, 중국어, 일본어, 독일어, 프랑스어, 스페인어, 포르투갈어, 이탈리아어 등 수십 개 언어를 지원해요.
whats_new: |
  iPhone용 Shinsoku의 첫 번째 버전이에요.
