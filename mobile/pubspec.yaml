name: shinsoku_mobile
description: Flutter mobile shell for Shinsoku voice input.
publish_to: 'none'
version: 0.1.0+16

environment:
  sdk: ^3.9.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  record: ^6.2.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/app-icon.png
    - assets/smoke-ldc93s1.wav
  uses-material-design: true
